services:
  # 唯一接触 Docker socket 的组件:按白名单拉取/创建/启停 NapCat 与 SnowLuma。
  # 主框架只通过内部 HTTP 调用它,永远不直接拥有 Docker 权限。
  runtime-supervisor:
    image: ghcr.io/hill-1024/watching-bot:latest
    build: .
    command: ["./node_modules/.bin/tsx", "src/supervisor/main.ts"]
    container_name: watching-bot-supervisor
    restart: unless-stopped
    environment:
      - WATCHING_BOT_SUPERVISOR_TOKEN=${WATCHING_BOT_SUPERVISOR_TOKEN:?set a long random secret}
      - WATCHING_BOT_SUPERVISOR_PORT=8099
      - DOCKER_SOCKET=/var/run/docker.sock
      - TZ=Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - qqnet
    # 不发布任何宿主端口:只允许内部网络访问

  watching-bot:
    image: ghcr.io/hill-1024/watching-bot:latest
    build: .
    container_name: watching-bot
    restart: unless-stopped
    depends_on:
      - runtime-supervisor
    environment:
      - WATCHING_BOT_API_KEY=${WATCHING_BOT_API_KEY}
      - WATCHING_BOT_PANEL_TOKEN=${WATCHING_BOT_PANEL_TOKEN:?set a panel token}
      - WATCHING_BOT_PANEL_HOST=0.0.0.0
      - WATCHING_BOT_TIMESCALE=${WATCHING_BOT_TIMESCALE:-1}
      - WATCHING_BOT_MASTER_QQ=${WATCHING_BOT_MASTER_QQ:-0}
      - WATCHING_BOT_SUPERVISOR_URL=http://runtime-supervisor:8099
      - WATCHING_BOT_SUPERVISOR_TOKEN=${WATCHING_BOT_SUPERVISOR_TOKEN}
      # OneBot token:与所选 runtime 的 WS 配置保持一致
      - NAPCAT_TOKEN=${NAPCAT_TOKEN:-}
      - SNOWLUMA_TOKEN=${SNOWLUMA_TOKEN:-}
      # 兼容老部署的显式地址;有 supervisor 时默认走内网别名
      - NAPCAT_URL=${NAPCAT_URL:-}
      - SNOWLUMA_URL=${SNOWLUMA_URL:-}
      - TZ=Asia/Shanghai
    extra_hosts:
      # 本地模型网关:容器内用 host.docker.internal 访问宿主机服务(Linux 需显式注入)
      - "host.docker.internal:host-gateway"
    ports:
      # 只绑 loopback:面板不是公网服务
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./persona:/app/persona
    networks:
      - qqnet

networks:
  qqnet:
    # 固定名字:supervisor 创建 QQ 容器时按这个名字接入,别名 napcat/snowluma 才可解析
    name: watching-bot-qqnet
    driver: bridge
