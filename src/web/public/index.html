<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>watching-bot</title>
<style>
  :root {
    --bg: #131418;
    --panel: #191b20;
    --panel-2: #1e2026;
    --line: #262930;
    --fg: #e8e6e2;
    --dim: #a3a09b;
    --meta: #84817d;
    --accent: #d29e5c;
    --accent-ink: #16130e;
    --ok: #8bb089;
    --sleep: #7d8ba1;
    --err: #c97676;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --r-s: 8px;
    --r-m: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  button, input, select {
    font: inherit; color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: var(--r-s);
  }
  button {
    height: 36px; padding: 0 14px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.primary:hover { border-color: var(--accent); filter: brightness(1.06); }
  input, select { height: 36px; padding: 0 10px; width: 100%; }
  input::placeholder { color: var(--meta); }
  label { display: block; font-size: 12px; color: var(--dim); margin: 0 0 6px; }
  .helper { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .msg-error { font-size: 13px; color: var(--err); margin-top: 8px; }
  .msg-ok { font-size: 13px; color: var(--ok); margin-top: 8px; }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; padding: 0 24px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand b { font-size: 15px; letter-spacing: .02em; }
  .phase { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-family: var(--mono); }
  .phase i { width: 7px; height: 7px; border-radius: 50%; background: var(--meta); }
  .phase[data-p="awake"] { color: var(--ok); } .phase[data-p="awake"] i { background: var(--ok); }
  .phase[data-p="asleep"], .phase[data-p="sleep_transition"] { color: var(--sleep); }
  .phase[data-p="asleep"] i, .phase[data-p="sleep_transition"] i { background: var(--sleep); }
  .phase[data-p="waking"] { color: var(--accent); } .phase[data-p="waking"] i { background: var(--accent); }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--dim); }
  .clock b { color: var(--fg); font-weight: 500; }

  /* ---------- 主体 ---------- */
  main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 48px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-m); padding: 16px 18px;
  }
  .span7 { grid-column: span 7; } .span5 { grid-column: span 5; }
  @media (max-width: 900px) { .span7, .span5 { grid-column: span 12; } }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 14px; }
  .card h2 small { font-weight: 400; color: var(--meta); margin-left: 10px; font-size: 12px; }

  /* 状态变量行 */
  .vrow { display: grid; grid-template-columns: 76px 1fr 64px 84px; gap: 12px; align-items: center; padding: 7px 0; }
  .vrow .name { font-size: 13px; color: var(--fg); }
  .vrow .bar { height: 3px; background: var(--line); border-radius: 2px; }
  .vrow .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); transition: width .5s; }
  .vrow .num { font-family: var(--mono); font-size: 13px; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  .vrow input { height: 30px; font-family: var(--mono); font-size: 13px; text-align: right; }

  /* 键值行 */
  .krow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; font-size: 13px; }
  .krow .k { color: var(--dim); }
  .krow .v { font-family: var(--mono); font-size: 13px; text-align: right; }
  .krow .v.set { color: var(--ok); } .krow .v.unset { color: var(--err); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  /* 表单网格 */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .current-model { font-family: var(--mono); font-size: 13px; color: var(--accent); margin-bottom: 14px; }
  .current-model small { color: var(--meta); font-family: var(--sans); }

  /* 模块行 */
  .mrow { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .mrow:first-of-type { border-top: none; }
  .mrow .name b { font-size: 13px; margin-right: 8px; }
  .mrow .name span { color: var(--meta); font-size: 12px; font-family: var(--mono); }

  /* 注入流水 */
  .feed { max-height: 300px; overflow-y: auto; }
  .feed .item { padding: 8px 0; border-top: 1px solid var(--line-soft, #202228); }
  .feed .item:first-child { border-top: none; }
  .feed .head { font-size: 12px; margin-bottom: 2px; }
  .feed .kind { font-family: var(--mono); margin-right: 8px; }
  .feed .kind.feeling { color: var(--accent); }
  .feed .kind.env { color: var(--sleep); }
  .feed .t { color: var(--meta); font-family: var(--mono); }
  .feed .text { font-size: 13px; color: var(--fg); }
  .empty { color: var(--dim); font-size: 13px; padding: 12px 0; }

  /* sparkline */
  .srow { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; padding: 4px 0; }
  .srow .name { font-size: 13px; color: var(--dim); }
  svg.spark { width: 100%; height: 40px; display: block; }
  svg.spark path { fill: none; stroke: var(--accent); stroke-width: 1.5; }

  /* 登录 */
  #gate {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    display: none; align-items: center; justify-content: center;
  }
  #gate .box { width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 28px; }
  #gate h1 { font-size: 16px; margin: 0 0 4px; }
  #gate p { font-size: 13px; color: var(--dim); margin: 0 0 18px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>watching-bot</h1>
    <p>面板已开启鉴权,输入 WATCHING_BOT_PANEL_TOKEN 对应的口令。</p>
    <label for="gate-token">口令</label>
    <input id="gate-token" type="password" autocomplete="current-password" />
    <div class="btns"><button class="primary" id="gate-go">进入</button></div>
    <div id="gate-msg"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="brand">
      <b>watching-bot</b>
      <span class="phase" id="phase" data-p=""><i></i><span id="phase-text">连接中</span></span>
    </div>
    <div class="clock"><b id="sim">--:--</b> <span id="scale">×1</span></div>
  </header>

  <main>
    <div class="grid">

      <section class="card span7">
        <h2>状态变量 <small>直接改数值立即生效</small></h2>
        <div id="vars"></div>
      </section>

      <section class="card span5">
        <h2>睡眠与时间</h2>
        <div class="krow"><span class="k">本段睡眠</span><span class="v" id="sleepdur">—</span></div>
        <div class="krow"><span class="k">赖床次数</span><span class="v" id="snooze">0</span></div>
        <div class="krow"><span class="k">timeScale</span>
          <span style="display:flex;gap:8px;width:170px">
            <input id="ts" type="number" min="1" step="1" value="" />
            <button id="ts-go" style="width:64px">应用</button>
          </span>
        </div>
        <div class="btns">
          <button data-act="/api/sleep">强制入睡</button>
          <button data-act="/api/wake">强制唤醒</button>
          <button data-act="/api/consolidate">整理记忆</button>
        </div>
        <div id="act-msg"></div>
      </section>

      <section class="card span7">
        <h2>模型 <small id="model-note"></small></h2>
        <div class="current-model" id="model-current">—</div>
        <div class="form-grid">
          <div>
            <label for="m-provider">Provider(pi 目录)</label>
            <select id="m-provider"></select>
          </div>
          <div>
            <label for="m-model">模型</label>
            <select id="m-model"></select>
          </div>
          <div class="full">
            <label for="m-baseurl">baseUrl(可选)</label>
            <input id="m-baseurl" placeholder="https://open.bigmodel.cn/api/paas/v4" />
            <div class="helper">留空 = 使用 pi 目录端点;填了 = 任意 OpenAI 兼容端点</div>
          </div>
          <div>
            <label for="m-key">API Key</label>
            <input id="m-key" type="password" placeholder="" autocomplete="off" />
            <div class="helper" id="m-key-helper">留空 = 保持现有配置</div>
          </div>
          <div>
            <label for="m-ctx">contextWindow</label>
            <input id="m-ctx" type="number" min="0" step="1000" />
            <div class="helper">留空 = 沿用配置文件的值</div>
          </div>
        </div>
        <div class="btns"><button class="primary" id="m-apply" style="min-width:96px">应用并热切换</button></div>
        <div id="m-msg"></div>
      </section>

      <section class="card span5">
        <h2>能力模块 <small>热插拔</small></h2>
        <div id="modlist"></div>
      </section>

      <section class="card span7">
        <h2>注入流水 <small>它感受到了什么</small></h2>
        <div class="feed" id="injections"><div class="empty">加载中…</div></div>
      </section>

      <section class="card span5">
        <h2>状态历史</h2>
        <div id="sparks"><div class="empty">等待数据…</div></div>
      </section>

    </div>
  </main>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// ---------- 鉴权入口:?token= 捕获 → 无 token 直进 → 401 才出登录卡 ----------
const params = new URLSearchParams(location.search);
if (params.has("token")) {
  localStorage.setItem("wb_token", params.get("token"));
  params.delete("token");
  history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params : ""));
}
const token = () => localStorage.getItem("wb_token") || "";

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (token()) headers.Authorization = "Bearer " + token();
  return fetch(path, { ...opts, headers });
}

async function boot() {
  let res;
  try {
    res = await api("/api/status");
  } catch {
    gateShow("无法连接后端,请确认 watching-bot 正在运行。", true);
    return;
  }
  if (res.status === 401) { gateShow(""); return; }
  if (!res.ok) { gateShow("后端异常: HTTP " + res.status, true); return; }
  enter();
}
function gateShow(msg, isError) {
  $("gate").style.display = "flex";
  $("app").style.display = "none";
  $("gate-msg").textContent = msg || "";
  $("gate-msg").className = isError ? "msg-error" : "";
  if (msg) $("gate-msg").className = "msg-error";
}
async function gateSubmit() {
  localStorage.setItem("wb_token", $("gate-token").value.trim());
  try {
    const res = await api("/api/status");
    if (res.status === 401) { gateShow("口令不正确。"); return; }
    if (!res.ok) { gateShow("后端异常: HTTP " + res.status, true); return; }
    enter();
  } catch { gateShow("无法连接后端。", true); }
}
$("gate-go").addEventListener("click", gateSubmit);
$("gate-token").addEventListener("keydown", (e) => { if (e.key === "Enter") gateSubmit(); });

function enter() {
  $("gate").style.display = "none";
  $("app").style.display = "block";
  refresh();
  loadModel();
  loadHistory();
  setInterval(refresh, 2000);
  setInterval(loadHistory, 10000);
}

async function post(path, body) {
  const res = await api(path, { method: "POST", body: JSON.stringify(body ?? {}) });
  return { ok: res.ok, data: await res.json().catch(() => ({})) };
}

// ---------- 状态轮询 ----------
const VARS = [
  ["fatigue", "疲惫", 0, 100], ["mood", "心情", -100, 100], ["annoyance", "烦躁", 0, 100],
  ["stress", "压力", 0, 100], ["social", "社交电量", 0, 100],
];
const PHASE_TEXT = { awake: "醒着", asleep: "睡着", sleep_transition: "正在入睡", waking: "被吵醒,犹豫中" };
let curScale = null;

async function refresh() {
  let s;
  try { s = await (await api("/api/status")).json(); } catch { return; }
  const ph = $("phase");
  ph.dataset.p = s.phase;
  $("phase-text").textContent = PHASE_TEXT[s.phase] ?? s.phase;
  const d = new Date(s.simMs);
  const p2 = (n) => String(n).padStart(2, "0");
  $("sim").textContent = `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  $("scale").textContent = "×" + s.timeScale;
  if (curScale == null) $("ts").value = s.timeScale;
  $("sleepdur").textContent = s.sleepStartedSim ? Math.round((s.simMs - s.sleepStartedSim) / 60000) + " 模拟分" : "—";
  $("snooze").textContent = s.snoozeCount;
  renderVars(s.vars);
  renderModules(s.modules);
  loadInjections();
}
function renderVars(vars) {
  $("vars").innerHTML = VARS.map(([k, label, min, max]) => {
    const v = vars[k] ?? 0;
    const pct = (((v - min) / (max - min)) * 100).toFixed(1);
    return `<div class="vrow"><span class="name">${label}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span class="num">${(Math.round(v * 10) / 10).toFixed(1)}</span>
      <input type="number" value="${(Math.round(v * 10) / 10).toFixed(1)}" step="1"
        aria-label="${label}数值" onchange="setVar('${k}', Number(this.value))" /></div>`;
  }).join("");
}
function renderModules(mods) {
  const known = new Set(mods.map((m) => m.name));
  let html = mods.map((m) =>
    `<div class="mrow"><span class="name"><b>${m.name}</b><span>${m.toolNames.length} 工具</span></span>
     <button data-mod="${m.name}" data-on="0">停用</button></div>`).join("");
  for (const n of ["mock", "napcat"]) {
    if (!known.has(n)) {
      html += `<div class="mrow"><span class="name"><b>${n}</b><span>未启用</span></span>
        <button data-mod="${n}" data-on="1">启用</button></div>`;
    }
  }
  $("modlist").innerHTML = html || `<div class="empty">没有注册任何模块工厂</div>`;
  for (const b of $("modlist").querySelectorAll("button")) {
    b.addEventListener("click", () => post("/api/modules", { name: b.dataset.mod, enable: b.dataset.on === "1" }).then(refresh));
  }
}
async function setVar(name, value) { await post("/api/vars", { name, value }); refresh(); }
async function act(path) {
  const r = await post(path);
  $("act-msg").textContent = r.ok ? "已执行。" : (r.data.error || "执行失败");
  $("act-msg").className = r.ok ? "msg-ok" : "msg-error";
  refresh();
}
for (const b of document.querySelectorAll("[data-act]")) {
  b.addEventListener("click", () => act(b.dataset.act));
}
$("ts-go").addEventListener("click", async () => {
  const r = await post("/api/timescale", { value: Number($("ts").value) });
  $("act-msg").textContent = r.ok ? "timeScale 已切换。" : (r.data.error || "失败");
  $("act-msg").className = r.ok ? "msg-ok" : "msg-error";
  curScale = null; refresh();
});

// ---------- 模型配置 ----------
async function loadModel() {
  let m;
  try { m = await (await api("/api/model")).json(); } catch { return; }
  const note = $("model-note");
  if (m.faux) {
    note.textContent = "faux 测试模式下不可切换(WATCHING_BOT_FAUX_LLM=1)";
    for (const el of ["m-provider", "m-model", "m-baseurl", "m-key", "m-ctx", "m-apply"]) $(el).disabled = true;
  }
  $("model-current").innerHTML =
    `${m.provider} / ${m.model}` +
    (m.baseUrl ? ` <small>@ ${m.baseUrl}</small>` : " <small>(pi 目录端点)</small>") +
    `<small> · key: ${m.apiKeySet ? "已配置 " + m.apiKeyMasked : "未配置(" + m.apiKeyEnv + ")"}</small>`;
  $("m-key").placeholder = m.apiKeySet ? "已配置,留空保持不变" : "未配置";
  $("m-key-helper").textContent = m.apiKeySet
    ? "留空 = 保持现有配置;写入后保存在 data/model.json(本地)"
    : "也可改用环境变量 " + m.apiKeyEnv;
  $("m-ctx").placeholder = String(m.contextWindow);

  const provSel = $("m-provider");
  if (provSel.options.length === 0) {
    provSel.innerHTML = (m.providers || []).map((p) => `<option>${p}</option>`).join("");
    provSel.value = m.baseUrl ? "" : m.provider; // 自定义端点时默认选自定义
    if (m.baseUrl && !provSel.value) {
      provSel.insertAdjacentHTML("afterbegin", `<option value="${m.provider}">${m.provider}(自定义端点)</option>`);
      provSel.value = m.provider;
    }
    provSel.addEventListener("change", () => fillModels(provSel.value, ""));
  }
  if (!m.baseUrl) { provSel.value = m.provider; await fillModels(m.provider, m.model); }
  else { $("m-model").insertAdjacentHTML("afterbegin", `<option>${m.model}</option>`); $("m-model").value = m.model; }
  $("m-baseurl").value = m.baseUrl || "";
}
async function fillModels(provider, selected) {
  const sel = $("m-model");
  sel.innerHTML = `<option value="">加载中…</option>`;
  try {
    const r = await api("/api/model/catalog?provider=" + encodeURIComponent(provider));
    const data = await r.json();
    sel.innerHTML = (data.models || []).map((id) => `<option>${id}</option>`).join("") || `<option value="">(该 provider 无目录模型,请配 baseUrl)</option>`;
    if (selected && data.models?.includes(selected)) sel.value = selected;
  } catch {
    sel.innerHTML = `<option value="">加载失败</option>`;
  }
}
$("m-apply").addEventListener("click", async () => {
  const body = {
    provider: $("m-provider").value,
    model: $("m-model").value,
    baseUrl: $("m-baseurl").value.trim(),
    contextWindow: Number($("m-ctx").value) || 0,
  };
  if ($("m-key").value.trim() !== "") body.apiKey = $("m-key").value.trim();
  if (!body.model) { $("m-msg").textContent = "请先选择模型。"; $("m-msg").className = "msg-error"; return; }
  const r = await post("/api/model", body);
  $("m-msg").textContent = r.ok ? "已切换,后续调用使用新模型。" : (r.data.error || "切换失败");
  $("m-msg").className = r.ok ? "msg-ok" : "msg-error";
  if (r.ok) { $("m-key").value = ""; loadModel(); }
});

// ---------- 注入流水与历史曲线 ----------
async function loadInjections() {
  let list;
  try { list = await (await api("/api/injections")).json(); } catch { return; }
  if (!list.length) { $("injections").innerHTML = `<div class="empty">还没有注入记录。</div>`; return; }
  $("injections").innerHTML = list.map((i) => {
    const t = new Date(i.ts_sim).toLocaleString("zh-CN");
    return `<div class="item"><div class="head"><span class="kind ${i.channel}">${i.channel === "feeling" ? "体感 " + i.kind : "环境 " + i.kind}</span><span class="t">${t}</span></div>
      <div class="text">${i.text}</div></div>`;
  }).join("");
}
const SPARK_VARS = VARS;
async function loadHistory() {
  let h;
  try { h = await (await api("/api/history")).json(); } catch { return; }
  if (!h.length) return;
  $("sparks").innerHTML = SPARK_VARS.map(([k, label, min, max]) => {
    const pts = h.map((r) => { try { return JSON.parse(r.vars)[k]; } catch { return undefined; } })
      .filter((v) => v !== undefined).slice(-200);
    if (pts.length < 2) return "";
    const lo = min, hi = max, W = 600, H = 40;
    const path = pts.map((v, i) =>
      `${i === 0 ? "M" : "L"}${((i / (pts.length - 1)) * W).toFixed(1)},${(H - ((v - lo) / (hi - lo || 1)) * H).toFixed(1)}`).join(" ");
    return `<div class="srow"><span class="name">${label}</span>
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}历史曲线"><path d="${path}"/></svg></div>`;
  }).join("");
}

boot();
</script>
</body>
</html>
