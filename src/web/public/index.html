<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>watching-bot 管理面板</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e9f0; --dim:#8b93a5; --accent:#5b9dff; --ok:#4cc38a; --warn:#f0a020; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; padding:20px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; letter-spacing:.05em; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:6px 0; gap:8px; }
  .bar { height:6px; background:#232834; border-radius:3px; overflow:hidden; flex:1; margin:0 10px; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .4s; }
  .val { min-width:56px; text-align:right; font-variant-numeric:tabular-nums; }
  .phase { font-weight:700; }
  .phase.awake { color:var(--ok); } .phase.asleep, .phase.sleep_transition { color:#7f8ea8; } .phase.waking { color:var(--warn); }
  button, select, input { background:#232834; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  input[type=number] { width:90px; }
  input[type=range] { width:100%; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .feed { max-height:260px; overflow:auto; font-size:12px; }
  .feed .item { padding:6px 8px; border-bottom:1px solid var(--line); }
  .feed .meta { color:var(--dim); }
  .tag { display:inline-block; padding:0 6px; border-radius:4px; background:#232834; margin-right:6px; font-size:11px; color:var(--dim); }
  .tag.feeling { color:#e8a0c0; } .tag.env { color:#7fc8a9; }
  .modules .row button { min-width:64px; }
  .on { color:var(--ok); } .off { color:var(--dim); }
  #login { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:9; }
  svg.spark { width:100%; height:36px; }
</style>
</head>
<body>
<div id="login">
  <h1>watching-bot</h1>
  <input id="token" placeholder="面板 token" />
  <button onclick="saveToken()">进入</button>
</div>
<div id="app" style="display:none">
  <h1>watching-bot <span id="phase" class="phase">—</span></h1>
  <div class="sub" id="simline">—</div>
  <div class="grid">
    <div class="card" style="grid-column:1/-1">
      <h2>状态变量(可直接调整)</h2>
      <div id="vars"></div>
    </div>
    <div class="card">
      <h2>睡眠与时间</h2>
      <div class="row"><span>连续睡眠</span><span class="val" id="sleepdur">—</span></div>
      <div class="row"><span>赖床次数</span><span class="val" id="snooze">0</span></div>
      <div class="row"><span>timeScale</span>
        <span><input type="number" id="ts" min="1" max="100000" step="1" /><button onclick="setTs()">应用</button></span>
      </div>
      <div class="btns">
        <button onclick="post('/api/sleep')">强制入睡</button>
        <button onclick="post('/api/wake')">强制唤醒</button>
        <button onclick="post('/api/consolidate')">立即整理记忆</button>
      </div>
    </div>
    <div class="card modules">
      <h2>能力模块(热插拔)</h2>
      <div id="modlist"></div>
    </div>
    <div class="card">
      <h2>最近注入(它感受到了什么)</h2>
      <div class="feed" id="injections"></div>
    </div>
    <div class="card" style="grid-column:1/-1">
      <h2>状态历史</h2>
      <div id="sparks"></div>
    </div>
  </div>
</div>
<script>
const TOKEN = localStorage.getItem("wb_token") || "";
if (TOKEN) enter();
function saveToken() { localStorage.setItem("wb_token", document.getElementById("token").value); enter(); }
function enter() {
  if (!localStorage.getItem("wb_token")) return;
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  refresh();
  setInterval(refresh, 2000);
}
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("wb_token") } });
  if (res.status === 401) { document.getElementById("login").style.display = "flex"; throw new Error("unauthorized"); }
  return res.json();
}
async function post(path, body) { await api(path, { method: "POST", body: JSON.stringify(body ?? {}) }); refresh(); }
function setTs() { post("/api/timescale", { value: Number(document.getElementById("ts").value) }); }
function setVar(name, value) { post("/api/vars", { name, value }); }

const varDefs = [
  ["fatigue", "疲惫", 0, 100], ["mood", "心情", -100, 100], ["annoyance", "烦躁", 0, 100],
  ["stress", "压力", 0, 100], ["social", "社交电量", 0, 100],
];
let lastStatus = null;
async function refresh() {
  try {
    const s = await api("/api/status");
    lastStatus = s;
    document.getElementById("phase").textContent = s.phase;
    document.getElementById("phase").className = "phase " + s.phase;
    document.getElementById("simline").textContent = `模拟时间 ${s.sim} · timeScale ${s.timeScale}`;
    document.getElementById("sleepdur").textContent = s.sleepStartedSim ? Math.round((s.simMs - s.sleepStartedSim) / 60000) + " 模拟分" : "—";
    document.getElementById("snooze").textContent = s.snoozeCount;
    if (!document.getElementById("ts").value) document.getElementById("ts").value = s.timeScale;
    renderVars(s.vars);
    renderModules(s.modules);
  } catch {}
  try {
    const inj = await api("/api/injections");
    document.getElementById("injections").innerHTML = inj.map(i =>
      `<div class="item"><span class="tag ${i.channel}">${i.channel === "feeling" ? "体感" : "环境"} ${i.kind}</span><span class="meta">${new Date(i.ts_sim).toLocaleString("zh-CN")}</span><br/>${i.text}</div>`).join("");
  } catch {}
}
function renderVars(vars) {
  document.getElementById("vars").innerHTML = varDefs.map(([k, label, min, max]) => {
    const v = vars[k] ?? 0;
    const pct = ((v - min) / (max - min) * 100).toFixed(1);
    return `<div class="row"><span style="min-width:70px">${label}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span class="val">${Math.round(v * 10) / 10}</span>
      <input type="number" style="width:76px" value="${Math.round(v * 10) / 10}" step="1"
        onchange="setVar('${k}', Number(this.value))" /></div>`;
  }).join("");
}
function renderModules(mods) {
  document.getElementById("modlist").innerHTML = mods.map(m =>
    `<div class="row"><span><span class="on">●</span> <b>${m.name}</b> <span class="meta">${m.toolNames.length} 工具</span></span>
     <button onclick="post('/api/modules',{name:'${m.name}',enable:false})">停用</button></div>`).join("")
    || "(无)";
  const known = new Set(mods.map(m => m.name));
  ["mock","napcat"].filter(n => !known.has(n)).forEach(n =>
    { document.getElementById("modlist").innerHTML += `<div class="row"><span><span class="off">○</span> <b>${n}</b> <span class="meta">未启用</span></span>
     <button onclick="post('/api/modules',{name:'${n}',enable:true})">启用</button></div>`; });
}
// 历史曲线(内联 sparkline)
async function loadHistory() {
  try {
    const h = await api("/api/history");
    if (!h.length) return;
    document.getElementById("sparks").innerHTML = varDefs.map(([k, label]) => {
      const pts = h.filter(r => { const v = JSON.parse(r.vars); return v[k] !== undefined; }).slice(-200);
      if (pts.length < 2) return "";
      const vals = pts.map(r => JSON.parse(r.vars)[k]);
      const min = Math.min(...vals, varDefs.find(d => d[0] === k)[2]), max = Math.max(...vals, varDefs.find(d => d[0] === k)[3]);
      const W = 600, H = 36;
      const path = vals.map((v, i) => `${i === 0 ? "M" : "L"}${(i / (vals.length - 1) * W).toFixed(1)},${(H - (v - min) / (max - min || 1) * H).toFixed(1)}`).join(" ");
      return `<div class="row"><span style="min-width:70px">${label}</span><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#5b9dff" stroke-width="1.5"/></svg></div>`;
    }).join("");
  } catch {}
}
setInterval(loadHistory, 10000);
loadHistory();
</script>
</body>
</html>
