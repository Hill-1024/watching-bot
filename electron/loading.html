<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>watching-bot</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(211, 160, 95, 0.14), transparent 46%),
          linear-gradient(145deg, #141922, #090b0f 70%);
        color: #e8e2d6;
        font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .box { text-align: center; }
      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 22px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: linear-gradient(160deg, #1a1f27, #090b0f);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
        display: grid;
        place-items: center;
      }
      .mark svg { width: 58px; height: 58px; }
      h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
      p { margin: 0; color: #8d8a83; }
      .dots { display: inline-flex; gap: 7px; margin-top: 18px; }
      .dots i {
        width: 6px; height: 6px; border-radius: 50%; background: #d3a05f;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .dots i:nth-child(2) { animation-delay: 0.15s; }
      .dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">
        <svg viewBox="0 0 128 128" aria-hidden="true">
          <defs>
            <linearGradient id="gold" x1="34" y1="44" x2="98" y2="92" gradientUnits="userSpaceOnUse">
              <stop stop-color="#f6ddb0" />
              <stop offset=".45" stop-color="#d3a05f" />
              <stop offset="1" stop-color="#a97132" />
            </linearGradient>
          </defs>
          <circle cx="64" cy="64" r="41" stroke="url(#gold)" stroke-opacity=".32" stroke-width="1.2" fill="none" />
          <path d="M36.5 48.5 L47.5 84 L64 60.5 L80.5 84 L91.5 48.5" stroke="url(#gold)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
      </div>
      <h1>watching-bot</h1>
      <p>正在唤醒主框架与 QQ 运行时…</p>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
  </body>
</html>
