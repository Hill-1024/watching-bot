<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">watching-bot</title>
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1f27"/>
      <stop offset=".55" stop-color="#10141a"/>
      <stop offset="1" stop-color="#090b0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="34" y1="44" x2="98" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6ddb0"/>
      <stop offset=".45" stop-color="#d3a05f"/>
      <stop offset="1" stop-color="#a97132"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(64 66) rotate(90) scale(52)">
      <stop stop-color="#d3a05f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d3a05f" stop-opacity="0"/>
