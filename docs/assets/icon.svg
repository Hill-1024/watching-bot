    </filter>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#bg)" stroke="#242b35" stroke-width="1.5"/>
  <rect x="3.75" y="3.75" width="120.5" height="120.5" rx="29.25" stroke="#ffffff" stroke-opacity=".04" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="52" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="41" stroke="url(#gold)" stroke-opacity=".32" stroke-width="1.2"/>
  <path d="M36.5 48.5 L47.5 84 L64 60.5 L80.5 84 L91.5 48.5" stroke="url(#gold)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <circle cx="94.5" cy="31.5" r="3.6" fill="#f6ddb0"/>
  <circle cx="94.5" cy="31.5" r="8.2" stroke="#f6ddb0" stroke-opacity=".16"/>
