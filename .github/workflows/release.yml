name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            runtime_platform: win32
            artifact: windows-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            runtime_platform: linux
            artifact: linux-x64
          - os: macos-13
            platform: mac
            arch: x64
            runtime_platform: darwin
            artifact: macos-x64
          - os: macos-14
            platform: mac
            arch: arm64
            runtime_platform: darwin
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Generate application icons
        run: npm run icons

      - name: Prepare server sidecar
        run: npm run prepare:server

      - name: Fetch bundled Node runtime
        run: node scripts/fetch-node-runtime.mjs
        env:
          NODE_RUNTIME_VERSION: 22.19.0
          NODE_RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
          NODE_RUNTIME_ARCH: ${{ matrix.arch }}

      - name: Build Electron package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  release:
    name: publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: true
