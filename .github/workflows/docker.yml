name: docker

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/hill-1024/watching-bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull ${{ env.IMAGE }}:sha-${GITHUB_SHA::7}

      - name: Boot check (faux LLM, no network needed)
        run: |
          docker run -d --name wb \
            -e WATCHING_BOT_FAUX_LLM=1 \
            -e WATCHING_BOT_TIMESCALE=60 \
            -p 18080:8080 \
            ${{ env.IMAGE }}:sha-${GITHUB_SHA::7}
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/api/status || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && break
            sleep 3
          done
          docker logs wb | tail -40
          docker logs wb | grep -q "管理面板" || { echo "::error::panel did not start"; exit 1; }
          docker stop wb
